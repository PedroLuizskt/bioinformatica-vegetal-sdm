# Integracao continua: lint + testes + teste de fumaca do lado Python.
# Roda em Linux e Windows para provar que o pacote bioflora e multiplataforma.
# Usa requirements/base.txt (intencao): o requirements.lock.txt e gerado no
# Windows e traz pacotes exclusivos dele (ex.: pywin32).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Instalar dependencias e o pacote bioflora
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt
          python -m pip install --no-deps -e .

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Testes (pytest)
        run: python -m pytest

      - name: Teste de fumaca (offline)
        run: python scripts/smoke_test.py --offline
